<style>
/* VOICE: app nativa iPhone su iOS 27, pulita e tattile
   IDEA: Liquid Glass: barre e pulsanti in vetro che galleggiano sopra il contenuto
   PICTURE: card esercizio con griglia dei giri e scala RPE 1-10 a tocco, da verde a rosso
   COLOUR and TYPE: colori di sistema iOS, tinta arancio; font di sistema SF, numeri arrotondati
   LAYOUT: titolo grande, card ad angoli ampi, tab bar a capsula staccata dal bordo */
:root{color-scheme:light dark;
--bg:light-dark(#f2f2f7,#000);--cell:light-dark(#fff,#1c1c1e);--fill:light-dark(rgba(120,120,128,.12),rgba(120,120,128,.24));
--sep:light-dark(rgba(60,60,67,.18),rgba(84,84,88,.5));--ink:light-dark(#000,#fff);--mute:light-dark(#8a8a8e,#8d8d93);
--tint:#ff9500;--red:#ff3b30;--green:#34c759;
--glass:light-dark(rgba(255,255,255,.62),rgba(40,40,44,.55));--rim:light-dark(rgba(255,255,255,.9),rgba(255,255,255,.18));
--shadow:0 8px 30px light-dark(rgba(0,0,0,.12),rgba(0,0,0,.5)),0 1px 2px rgba(0,0,0,.08)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:320px;background:radial-gradient(120% 90% at 15% 0,color-mix(in srgb,var(--tint) 28%,transparent),transparent 60%),radial-gradient(90% 80% at 95% 10%,color-mix(in srgb,#ff2d55 16%,transparent),transparent 60%);pointer-events:none;z-index:-1}
.app{max-width:560px;margin:0 auto;padding:env(safe-area-inset-top) max(16px,env(safe-area-inset-right)) 130px max(16px,env(safe-area-inset-left))}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:var(--shadow),inset 0 1px 0 var(--rim),inset 0 -1px 0 light-dark(rgba(0,0,0,.04),rgba(255,255,255,.05));border:.5px solid light-dark(rgba(0,0,0,.06),rgba(255,255,255,.1))}
.navbar{position:sticky;top:env(safe-area-inset-top);z-index:5;display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px;min-height:62px}
.navbar.flat{min-height:24px}
.gbtn{border:0;color:var(--ink);font:inherit;cursor:pointer;min-height:44px;min-width:44px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 14px}
.gbtn.round{padding:0;width:44px}
.gbtn svg{width:20px;height:20px}
.gbtn.tinted{background:var(--tint);color:#fff;font-weight:600;box-shadow:0 6px 18px color-mix(in srgb,var(--tint) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.45)}
.gbtn:active,.tile:active{transform:scale(.96)}
h1{font:700 34px/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;letter-spacing:.2px;margin:6px 4px 6px}
.lead{color:var(--mute);font-size:15px;margin:0 4px 6px}
.hdr{font-size:15px;font-weight:600;margin:26px 4px 9px}
.ftr{font-size:13px;color:var(--mute);margin:8px 4px 0}
.group{background:var(--cell);border-radius:26px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;min-height:50px;position:relative;width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:.5px solid var(--sep)}
button.row{cursor:pointer}button.row:active{background:var(--fill)}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none;font-weight:700;font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.grow{flex:1}
.t{display:block}.s{display:block;font-size:14px;color:var(--mute)}
.val{color:var(--mute)}
.tiles{display:grid;gap:12px}
.tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:18px;border-radius:28px;background:var(--cell);border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:transform .15s}
.tile .ico{width:48px;height:48px;border-radius:15px;font-size:20px}
.tile b{font-size:19px;font-weight:600;display:block}
.play{width:40px;height:40px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--tint)}
.ex{background:var(--cell);border-radius:26px;padding:16px 16px 14px;margin-bottom:12px}
.exh{display:flex;align-items:flex-start;gap:10px}
.exh .grow b{font-weight:600;display:block;font-size:17px}
.badge{flex:none;min-width:64px;text-align:center;border-radius:999px;padding:6px 12px;font:600 14px -apple-system,system-ui,sans-serif;background:var(--fill);color:var(--mute);font-variant-numeric:tabular-nums}
.badge b{font-size:17px;margin-left:3px}
.kg{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:14px;margin-top:3px}
.kg input{width:48px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);font:600 15px -apple-system,system-ui,sans-serif;text-align:center;padding:4px 0}
.grid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;margin-top:12px}
.cell{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:16px;background:var(--fill);padding:6px 0 7px;cursor:text;box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s}
.cell span{font-size:11px;color:var(--mute)}
.cell input{width:100%;border:0;background:transparent;text-align:center;color:var(--ink);font:600 24px ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;padding:0;font-variant-numeric:tabular-nums}
.cell.low{box-shadow:inset 0 0 0 2px var(--tint)}.cell.up{box-shadow:inset 0 0 0 2px var(--green)}
.cell:focus-within{background:color-mix(in srgb,var(--tint) 16%,transparent)}
input:focus{outline:none}
.rpe{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-top:12px;padding:3px;border-radius:999px;background:var(--fill)}
.rpe button{border:0;min-height:38px;border-radius:999px;background:transparent;color:var(--mute);font:600 15px ui-rounded,-apple-system,system-ui,sans-serif;cursor:pointer;padding:0;transition:background .15s,color .15s}
.rpe button.on{color:#fff;background:var(--c);box-shadow:0 3px 10px color-mix(in srgb,var(--c) 50%,transparent),inset 0 1px 0 rgba(255,255,255,.35)}
.rpe button.lit{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ink)}
.rpel{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin:5px 8px 0}
.gbtn:focus-visible,.row:focus-visible,.tile:focus-visible,.rpe button:focus-visible,textarea:focus-visible,.tab:focus-visible,.seg button:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.fld{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:right;padding:0}
textarea{width:100%;min-height:84px;border:0;background:var(--cell);color:var(--ink);font:inherit;padding:14px 18px;border-radius:26px;resize:vertical;display:block}
.cta{display:block;width:100%;margin-top:22px;min-height:54px;border-radius:999px;font-size:17px}
.pill{font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.p{background:color-mix(in srgb,var(--green) 20%,transparent);color:light-dark(#1d8a3a,#4cd964)}
.pill.m{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.pill.n{background:var(--fill);color:var(--mute)}
.seg{display:flex;border-radius:999px;padding:4px;margin:8px 0 0;gap:2px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:500 14px -apple-system,system-ui,sans-serif;padding:8px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:38px}
.seg button[aria-pressed=true]{background:var(--cell);box-shadow:0 2px 8px rgba(0,0,0,.15);font-weight:600}
.fig{position:relative;height:210px;margin:6px 0 4px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.big{font:700 38px/1 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:600;color:var(--mute);margin-left:4px}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:2px;padding:5px;border-radius:999px;z-index:6;width:min(340px,calc(100% - 40px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);text-decoration:none;font-size:10.5px;font-weight:600;min-height:54px;justify-content:center;border-radius:999px}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--tint);background:var(--fill)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);color:var(--ink);padding:12px 20px;border-radius:999px;transition:transform .35s cubic-bezier(.2,1.3,.4,1);z-index:9;font-size:15px;font-weight:600}
.toast.on{transform:translate(-50%,0)}
.del{color:var(--red)}
.exl{display:block;font-size:13px;color:var(--mute);margin-top:4px;line-height:1.35}
.hidden{display:none}
.x{border:0;background:var(--fill);color:var(--mute);width:30px;height:30px;border-radius:50%;cursor:pointer;flex:none}
@media(prefers-reduced-motion:reduce){.toast,.tile,.rpe button,.cell{transition:none}}

.tabbar{width:min(400px,calc(100% - 32px))}
.tab{font-size:10px}
.hdrrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 4px 9px}
.hdrrow .hdr{margin:0}
.q{border:0;background:var(--fill);color:var(--tint);width:26px;height:26px;border-radius:50%;font:700 14px -apple-system,system-ui,sans-serif;cursor:pointer;flex:none;display:inline-grid;place-items:center}
.small{min-height:36px;padding:0 14px;font-size:15px;font-weight:600;background:var(--fill);color:var(--tint)}
.tog{border:0;border-radius:16px;min-height:62px;font:700 22px -apple-system,system-ui,sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.tog span{font:500 11px -apple-system,system-ui,sans-serif;color:inherit;opacity:.8}
.tog.ok{background:color-mix(in srgb,var(--green) 22%,transparent);color:light-dark(#1d8a3a,#4cd964)}
.tog.no{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.banner{border-radius:22px;padding:14px 16px;margin-top:12px;display:grid;gap:10px}
.banner.warn{background:color-mix(in srgb,var(--tint) 16%,var(--cell))}
.banner.info{background:var(--cell)}
.banner b{font-weight:600}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}
.st{align-self:start;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st.go{background:color-mix(in srgb,var(--green) 20%,transparent);color:light-dark(#1d8a3a,#4cd964)}
.st.keep{background:var(--fill);color:var(--ink)}
.st.warn{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}
.st.none{background:var(--fill);color:var(--mute)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:12px 18px;position:relative}
.prow+.prow::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:.5px solid var(--sep)}
.prow .s{grid-column:1/3}
.edx{background:var(--cell);border-radius:22px;padding:12px 14px;margin-bottom:10px;display:grid;gap:8px}
.edx .top2{display:flex;gap:6px;align-items:center}
.edx input[type=text]{flex:1;border:0;border-radius:10px;background:var(--fill);color:var(--ink);font:600 16px -apple-system,system-ui,sans-serif;padding:9px 10px}
.edf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.edf label{font-size:11px;color:var(--mute);display:grid;gap:2px}
.edf input,.edf select{border:0;border-radius:10px;background:var(--fill);color:var(--ink);font:600 16px -apple-system,system-ui,sans-serif;padding:8px 6px;width:100%;text-align:center;-webkit-appearance:none;appearance:none}
.ck{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.ck input{width:22px;height:22px;accent-color:var(--tint)}
.ib{border:0;background:var(--fill);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:15px;flex:none}
.ib.del{color:var(--red)}
.step{display:flex;align-items:center;gap:10px}
.step b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35)}
.sheet.on{display:flex}
.sheet .pane{width:min(560px,100%);max-height:86vh;overflow:auto;border-radius:30px 30px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));background:var(--bg)}
.sheet h2{font-size:22px;margin:4px 4px 12px}
.leg{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:8px 10px;align-items:center;background:var(--cell);border-radius:22px;padding:14px;font-size:14px}
.leg .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.leg .h{font-size:12px;color:var(--mute);font-weight:600}
.gate{min-height:80vh;display:grid;align-content:center;gap:14px;text-align:center}
.gate img{width:84px;height:84px;border-radius:20px;margin:0 auto;box-shadow:var(--shadow)}
.gate ol{text-align:left;background:var(--cell);border-radius:22px;padding:16px 16px 16px 36px;margin:0;line-height:1.6}
.legend2{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.fig.mini{height:74px}
details summary{cursor:pointer;color:var(--tint);font-weight:600;padding:12px 18px;list-style:none}
details summary::-webkit-details-marker{display:none}
.vl{padding:10px 18px;border-top:.5px solid var(--sep);font-size:14px}
.vl b{font-weight:600}
.cell.bad{box-shadow:inset 0 0 0 2px var(--red)}
.kg input.bad{box-shadow:inset 0 0 0 2px var(--red)}
.open{flex:1;border:0;background:none;color:inherit;font:inherit;text-align:left;padding:0;cursor:pointer;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{min-width:38px;text-align:center;padding:5px 9px;border-radius:10px;background:var(--fill);font:600 16px ui-rounded,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.chip.low{box-shadow:inset 0 0 0 2px var(--tint)}.chip.up{box-shadow:inset 0 0 0 2px var(--green)}.chip.no{color:var(--red)}
</style>

 <p class="lead">Valuta sempre l'<b>ultimo giro</b> dell'esercizio: quante ripetizioni (o secondi) avresti potuto fare ancora.</p>

<script>
{
/* ---------- utilità ---------- */
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
const ms=iso=>new Date(iso+"T12:00").getTime();
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const x=parseFloat(String(v).replace(",","."));return isFinite(x)?x:""};
const fmt=iso=>new Date(iso+"T12:00").toLocaleDateString("it-IT",{weekday:"short",day:"numeric",month:"short"});
const fmtS=iso=>new Date(iso+"T12:00").toLocaleDateString("it-IT",{day:"numeric",month:"short"});
const kg=x=>String(Math.round(x*10)/10).replace(".",",");
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- schede di partenza (dalle tue schermate) ---------- */
const META={s1:{name:"Sessione 1",color:"#ff3b30",icon:"1"},s2:{name:"Sessione 2",color:"#5856d6",icon:"2"},diti:{name:"Diti",color:"#34c759",icon:"✋",fb:true}};
const DEF={
 s1:{rounds:4,ex:[
  {id:"pullz",name:"Pull-up zavorrati",u:"rip",t:6,load:5,bw:true,rest:60},
  {id:"pushr1",name:"Push-up piedi rialzati",u:"rip",t:12,load:0,bw:false,rest:45},
  {id:"scap",name:"Scapular pull-up",u:"rip",t:10,load:0,bw:true,rest:30},
  {id:"tric",name:"Tricipiti extension",u:"rip",t:10,load:0,bw:false,rest:45},
  {id:"lsit1",name:"L-sit",u:"rip",t:10,load:0,bw:false,rest:30},
  {id:"mclimb",name:"Mountain climber",u:"s",t:35,load:0,bw:false,rest:0}]},
 s2:{rounds:4,ex:[
  {id:"pull",name:"Pull-up",u:"rip",t:8,load:0,bw:true,rest:45},
  {id:"squat",name:"Squat zavorrati",u:"rip",t:12,load:10,bw:false,rest:45},
  {id:"pushr2",name:"Push-up piedi rialzati",u:"rip",t:12,load:10,bw:false,rest:30},
  {id:"ponte",name:"Ponte gluteo monogamba",u:"rip",t:20,load:0,bw:false,rest:30},
  {id:"dip",name:"Dip",u:"rip",t:7,load:0,bw:true,rest:30},
  {id:"plank",name:"Plank",u:"s",t:45,load:0,bw:false,rest:30},
  {id:"lsit2",name:"L-sit",u:"rip",t:10,load:0,bw:false,rest:90}]},
 diti:{rounds:3,ex:[
  {id:"hc",name:"Half crimp",u:"s",t:7,load:0,bw:true,rest:75},
  {id:"of",name:"Open fingers",u:"s",t:7,load:0,bw:true,rest:75}]}
};
const KEYS=Object.keys(META);

/* ---------- dati ---------- */
const LS="diario-allenamenti";
let S;
function initProtos(){const p={};for(const k of KEYS)p[k]=[{ver:1,date:today(),note:"Scheda iniziale",rounds:DEF[k].rounds,ex:clone(DEF[k].ex)}];return p}
function migrate(raw){
 if(raw&&raw.v===2&&raw.protos&&Array.isArray(raw.sessions))return raw;
 const out={v:2,protos:initProtos(),sessions:[],draft:null};
 if(raw&&Array.isArray(raw.sessions)){
  for(const k of KEYS)out.protos[k][0].date=raw.sessions.filter(s=>s.tpl==k).map(s=>s.date).sort()[0]||today();
  for(const s of raw.sessions){if(!META[s.tpl]||!s.d)continue;
   const p=DEF[s.tpl],d={};
   for(const e of p.ex){const old=s.d[e.id]||s.d[e.id.replace(/[12]$/,"")];if(!old)continue;

/* ---------- grafici ---------- */
function chart(svg,pts,{vlines=[],ymax=Infinity}={}){
 const draw=()=>{const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
  if(pts.length<2){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".5" font-size="14">Servono almeno 2 sessioni</text>`;return}
  const L=34,R=12,T=16,B=22,ys=pts.map(p=>p.y),mx=Math.max(...ys),mn=Math.min(...ys),pd=(mx-mn)||Math.max(1,mx*.1),lo=Math.max(0,mn-pd),hi=Math.min(ymax,mx+pd*.5);
  const t0=pts[0].t,t1=pts[pts.length-1].t,X=t=>L+(t1==t0?.5:(t-t0)/(t1-t0))*(W-L-R),Y=v=>T+(hi-v)/(hi-lo||1)*(H-T-B);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.y).toFixed(1)).join("");
  const grid=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="currentColor" opacity=".1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" opacity=".5">${Math.round(v)}</text>`).join("");
  const vl=vlines.filter(v=>v.t>=t0&&v.t<=t1).map(v=>`<line x1="${X(v.t)}" x2="${X(v.t)}" y1="${T-6}" y2="${H-B}" stroke="var(--tint)" stroke-dasharray="3 4" opacity=".8"/><text x="${X(v.t)+4}" y="${T}" font-size="11" fill="var(--tint)">${esc(v.l)}</text>`).join("");
  const dots=pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.y)}" r="5.5" fill="${p.c}" stroke="var(--cell)" stroke-width="2"/>`+(p.lab?`<text x="${X(p.t)}" y="${Y(p.y)-10}" text-anchor="middle" font-size="11" font-weight="600" fill="currentColor" opacity=".75">${esc(p.lab)}</text>`:"")).join("");
  const xl=`<text x="${L}" y="${H-5}" font-size="11" fill="currentColor" opacity=".5">${esc(fmtS(new Date(t0).toISOString().slice(0,10)))}</text><text x="${W-R}" y="${H-5}" text-anchor="end" font-size="11" fill="currentColor" opacity=".5">${esc(fmtS(new Date(t1).toISOString().slice(0,10)))}</text>`;
  svg.innerHTML=grid+vl+`<path d="${line}" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="2" stroke-linejoin="round"/>`+dots+xl;
 };
 const ro=new ResizeObserver(draw);ro.observe(svg);ros.push(ro);
}

/* ---------- Progressi ---------- */
function exList(k){const seen=new Map();for(const e of cur(k).ex)seen.set(e.id,{e,on:true});
 for(const s of sessOf(k))for(const e of s.ex)if(!seen.has(e.id))seen.set(e.id,{e,on:false});return [...seen.values()]}
function progressi(){
 const list=exList(ptpl);if(!pex||!list.some(x=>x.e.id==pex))pex=list[0].e.id;
 const info=list.find(x=>x.e.id==pex).e;
 const ss=sessOf(ptpl).filter(s=>s.d[pex]).reverse();
 const rows0=ss.map(s=>{const e=s.ex.find(x=>x.id==pex);return{s,e,date:s.date,p:perf(s,e),L:effLoad(s,e),w:work(s,e),r:s.d[pex].rpe,ext:+s.d[pex].load||0,rel:e.bw&&+s.bw>0?Math.round(effLoad(s,e)/s.bw*100):null}});
 let rows=rows0;
 if(pgroup=="week"){const g=new Map();for(const x of rows0){const k=monday(x.date);if(!g.has(k))g.set(k,[]);g.get(k).push(x)}
  rows=[...g.entries()].map(([k,a])=>{const sum=f=>a.some(x=>x[f]!=null)?a.reduce((t,x)=>t+(x[f]||0),0):null,mx=f=>a.some(x=>x[f]!=null)?Math.max(...a.map(x=>x[f]||0)):null,rs=a.map(x=>x.r).filter(Boolean);
   const last=a[a.length-1];return{s:last.s,e:last.e,date:k,p:sum("p"),w:sum("w"),L:mx("L"),rel:mx("rel"),ext:last.ext,r:rs.length?Math.round(rs.reduce((t,v)=>t+v,0)/rs.length):0,n:a.length}})}
 const isT=info.u=="s"&&!META[ptpl].fb,hasW=rows.some(x=>x.w!=null),hasR=rows.some(x=>x.rel!=null);
 if((pmode=="work"&&!hasW)||(pmode=="rel"&&!hasR))pmode="perf";
 const perfLab=isT?"Giri completati":info.u=="s"?"Secondi":"Ripetizioni";
 const modes=[["perf",perfLab]].concat(hasW?[["work","Lavoro"]]:[]).concat(isT?[]:[["load","Carico"]]).concat(hasR?[["rel","% peso"]]:[]);
 const val=x=>pmode=="work"?x.w:pmode=="load"?x.L:pmode=="rel"?x.rel:x.p;
 let prevL=null;
 const pts=rows.filter(x=>val(x)!=null).map(x=>{const lab=pmode=="perf"&&pgroup=="sess"&&!isT&&prevL!==null&&x.ext!==prevL?kg(x.ext)+" kg":"";prevL=x.ext;return{t:ms(x.date),y:val(x),c:x.r?RPEC(x.r):"#8e8e93",lab}});
 const vlines=S.protos[ptpl].filter(v=>v.ver>1).map(v=>({t:ms(v.date),l:"v"+v.ver}));
 const z=rows[rows.length-1],a=rows[0];
 const unit=pmode=="work"?"":pmode=="load"?" kg":pmode=="rel"?" %":isT?(pgroup=="week"?" giri":"/"+(z?z.s.rounds:"")):info.u=="s"?" s":" rip";
 const kpi=z&&val(z)!=null?`<div class="big">${pmode=="load"?kg(val(z)):val(z)}<small>${esc(unit)}</small> ${rows.length>1&&val(a)!=null&&val(z)!=null?`<span class="pill ${val(z)-val(a)>0?"p":val(z)-val(a)<0?"m":"n"}" style="vertical-align:middle">${val(z)-val(a)>0?"+":""}${pmode=="load"?kg(val(z)-val(a)):val(z)-val(a)} da inizio</span>`:""}</div>
  <div class="s">${pgroup=="week"?"Settimana del "+esc(fmtS(z.date))+" · "+z.n+" session"+(z.n==1?"e":"i"):"Ultima: "+esc(fmt(z.s.date))}${isT?"":" · carico effettivo "+kg(z.L)+" kg"} · RPE ${pgroup=="week"?"medio ":""}${z.r||"–"}</div>`:`<div class="s">Nessuna sessione con questo esercizio.</div>`;
 const expl={perf:isT?"Giri completati su quelli previsti.":"Somma su tutti i giri. Le etichette indicano un cambio di carico.",work:"Ripetizioni (o secondi) × carico effettivo. Sale anche se aumenti il peso e perdi una ripetizione.",load:info.bw?"Peso corporeo + zavorra.":"Solo la zavorra.",rel:"(Peso corporeo + zavorra) / peso corporeo: confrontabile anche se il tuo peso cambia."}[pmode]+(pgroup=="week"?" Per settimana: somma delle sessioni (carico e % peso: il massimo; RPE: la media).":"");
 app.innerHTML=`<div class="navbar flat"></div><h1>Progressi</h1>
 <div class="seg glass">${KEYS.map(k=>`<button data-ptpl="${k}" aria-pressed="${k==ptpl}">${esc(META[k].name)}</button>`).join("")}</div>
 <div class="hdr">${esc(info.name)}</div>
 <div class="group" style="padding:14px 16px 12px">${kpi}
  <div class="seg" style="background:var(--fill);margin-top:12px">${[["sess","Sessioni"],["week","Settimane"]].map(([g,l])=>`<button data-pgroup="${g}" aria-pressed="${g==pgroup}">${l}</button>`).join("")}</div>
  <div class="seg" style="background:var(--fill);margin-top:8px">${modes.map(([m,l])=>`<button data-pmode="${m}" aria-pressed="${m==pmode}">${l}</button>`).join("")}</div>
  <div class="fig"><svg id="chart" role="img" aria-label="Andamento ${esc(info.name)}"></svg></div>
  <div class="legend2"><span><i style="background:${RPEC(3)}"></i>RPE basso</span><span><i style="background:${RPEC(7)}"></i>RPE 7</span><span><i style="background:${RPEC(10)}"></i>RPE alto</span><span><i style="background:#8e8e93"></i>senza RPE</span><span style="color:var(--tint)">┆ cambio scheda</span></div>
  <div class="s" style="margin-top:12px">RPE nel tempo <button class="q" data-leg="1" aria-label="Legenda RPE">?</button></div>
  <div class="fig mini"><svg id="rchart" role="img" aria-label="RPE nel tempo"></svg></div>
 </div>
 <p class="ftr">${esc(expl)}</p>
 <div class="hdr">Esercizio</div><div class="group">${list.map(({e,on})=>`<button class="row" data-pex="${e.id}"><span class="grow">${esc(e.name)}${on?"":' <span class="s" style="display:inline">· non più in scheda</span>'}</span>${e.id==pex?'<span style="color:var(--tint);font-weight:600">✓</span>':""}</button>`).join("")}</div>`;
 chart(document.getElementById("chart"),pts,{vlines});
 chart(document.getElementById("rchart"),rows.filter(x=>x.r).map(x=>({t:ms(x.date),y:x.r,c:RPEC(x.r)})),{vlines,ymax:10});
}

/* ---------- Piano: stato di ogni esercizio ---------- */
function status(k,e){
 const L=sessOf(k).filter(s=>s.d[e.id]).map(s=>({s,e:s.ex.find(x=>x.id==e.id)}));
 if(!L.length)return{c:"none",l:"Nessun dato",why:"Ancora nessuna sessione con questo esercizio."};
 const last=L[0],r0=last.s.d[e.id].rpe,b0=below(last.s,last.e);
 if(b0>=2&&r0>=9)return{c:"warn",l:"Attenzione",why:`Ultima sessione: ${b0} giri sotto l'obiettivo con RPE ${r0}.`};
 if(L.length>=3){const p=L.slice(0,3).map(x=>perf(x.s,x.e)),ld=L.slice(0,3).map(x=>effLoad(x.s,x.e));
  if(p[0]<p[1]&&p[1]<p[2]&&ld[0]<=ld[2])return{c:"warn",l:"Attenzione",why:`In calo da 2 sessioni (${p[2]} → ${p[1]} → ${p[0]}) a parità di carico.`}}
 let n=0;for(const x of L){const r=x.s.d[e.id].rpe;if(x.e.t==e.t&&x.s.rounds==cur(k).rounds&&hit(x.s,x.e)&&r&&r<=7)n++;else break}
 const ar=f1(L.slice(0,Math.max(n,1)).reduce((a,x)=>a+(x.s.d[e.id].rpe||0),0)/Math.max(n,1));
 if(n>=3)return{c:"go",l:"Pronto a progredire",why:`${n} sessioni di fila all'obiettivo, RPE medio ${ar}.`};
 if(!hit(last.s,last.e))return{c:"keep",l:"Mantieni",why:`Obiettivo non ancora raggiunto: ${b0} ${b0==1?"giro":"giri"} sotto.`};
 if(!r0)return{c:"keep",l:"Mantieni",why:"Obiettivo raggiunto, ma manca l'RPE: senza non si può valutare."};
 if(r0>7)return{c:"keep",l:"Mantieni",why:`Obiettivo raggiunto con RPE ${r0}: serve arrivarci con RPE 7 o meno.`};
 return{c:"keep",l:"Mantieni",why:`${n} sessione${n==1?"":"i"} su 3 all'obiettivo con RPE ≤ 7.`};
}
function fatigue(k){
 const L=sessOf(k).slice(0,3);if(L.length<3)return null;
 const r=L.map(avgRpe);if(r.some(x=>!x))return null;
 if(r[0]>r[1]&&r[1]>r[2]&&metric(L[0])<=metric(L[2]))return `RPE medio in salita nelle ultime 3 sessioni (${f1(r[2])} → ${f1(r[1])} → ${f1(r[0])}) senza miglioramenti: possibile fatica accumulata, valuta uno scarico.`;
 return null;
}
function piano(){
 const sec=KEYS.map(k=>{const p=cur(k),fat=fatigue(k);
  const rows=p.ex.map(e=>{const st=status(k,e);return `<div class="prow"><span><b style="font-weight:600">${esc(e.name)}</b> <span class="s" style="display:inline">· ${tgt(e,p.rounds)}${e.load?" · "+kg(e.load)+" kg":""}</span></span><span class="st ${st.c}">${st.l}</span><span class="s">${esc(st.why)}</span></div>`}).join("");
  const vers=[...S.protos[k]].reverse().map(v=>`<div class="vl"><b>v${v.ver}</b> · ${esc(fmt(v.date))}${v.note?" · "+esc(v.note):""}</div>`).join("");
  return `<div class="hdrrow"><span class="hdr">${esc(META[k].name)} <span class="s" style="display:inline;font-weight:400">· v${p.ver} dal ${esc(fmtS(p.date))}</span></span><button class="gbtn small" data-edit="${k}">Modifica scheda</button></div>
  ${fat?`<div class="banner warn" style="margin:0 0 10px"><span>${esc(fat)}</span></div>`:""}
  <div class="group">${rows}<details><summary>Versioni della scheda (${S.protos[k].length})</summary>${vers}</details></div>`}).join("");
 app.innerHTML=`<div class="navbar flat"></div><div class="hdrrow" style="margin:6px 4px"><h1 style="margin:0">Piano</h1><button class="q" data-leg="1" aria-label="Legenda RPE" style="width:34px;height:34px">?</button></div>
 <p class="lead">Lo stato di ogni esercizio, per decidere tu come cambiare la scheda.</p>
 <div class="banner info"><span class="s"><b style="color:var(--ink)">Pronto a progredire</b>: obiettivo in tutti i giri con RPE ≤ 7 per 3 sessioni di fila. <b style="color:var(--ink)">Attenzione</b>: 2 o più giri sotto l'obiettivo con RPE ≥ 9, oppure 2 sessioni di fila in calo.</span></div>
 ${sec}`;
}

/* ---------- Modifica scheda ---------- */
function editor(){
 const k=edit.k,p=edit.p,fb=META[k].fb;
 const ex=p.ex.map((e,i)=>`<div class="edx"><div class="top2"><input type="text" data-ef="name" data-i="${i}" value="${esc(e.name)}" aria-label="Nome esercizio">
  <button class="ib" data-mv="-1" data-i="${i}" aria-label="Sposta su">↑</button><button class="ib" data-mv="1" data-i="${i}" aria-label="Sposta giù">↓</button><button class="ib del" data-rm="${i}" aria-label="Elimina esercizio">✕</button></div>
  <div class="edf"><label>Unità<select data-ef="u" data-i="${i}"><option value="rip"${e.u=="rip"?" selected":""}>rip</option><option value="s"${e.u=="s"?" selected":""}>sec</option></select></label>
  <label>Obiettivo<input inputmode="decimal" data-ef="t" data-i="${i}" value="${esc(e.t)}"></label>
  <label>${fb?"Zavorra":"Carico"} kg<input inputmode="decimal" data-ef="load" data-i="${i}" value="${esc(e.load)}"></label>
  <label>Pausa s<input inputmode="numeric" data-ef="rest" data-i="${i}" value="${esc(e.rest||"")}"></label></div>
  <label class="ck"><input type="checkbox" data-ef="bw" data-i="${i}"${e.bw?" checked":""}> Conta il peso corporeo nel carico</label></div>`).join("");
 app.innerHTML=`<div class="navbar"><button class="gbtn round glass" data-go="piano" aria-label="Annulla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><button class="gbtn tinted" id="e-save">Salva v${cur(k).ver+1}</button></div>
 <h1>${esc(META[k].name)}</h1><p class="lead">Salvando crei la versione ${cur(k).ver+1}. Le sessioni passate restano legate alla loro versione.</p>
 <div class="group" style="margin-top:12px"><div class="row"><span class="grow">Giri</span><span class="step"><button class="ib" data-rd="-1" aria-label="Meno giri">−</button><b id="e-r">${p.rounds}</b><button class="ib" data-rd="1" aria-label="Più giri">+</button></span></div></div>
 <div class="hdr">Esercizi</div>${ex}
 <button class="gbtn glass" id="e-add" style="width:100%">+ Aggiungi esercizio</button>
 <div class="hdr">Perché cambi?</div><textarea id="e-note" placeholder="Es. pull-up zavorrati pronti: +2,5 kg">${esc(edit.note)}</textarea>
 <button class="gbtn tinted cta" id="e-save2">Salva v${cur(k).ver+1}</button>`;
}
function saveEdit(){
 const k=edit.k,p=edit.p,old=cur(k);
 for(const e of p.ex){e.name=e.name.trim();if(!e.name){toast("Ogni esercizio deve avere un nome");return}if(!(+e.t>0)){toast("Obiettivo non valido: "+e.name);return}}
 if(!p.ex.length){toast("Serve almeno un esercizio");return}
 const strip=x=>JSON.stringify({r:x.rounds,ex:x.ex});
 if(strip(p)==strip(old)){toast("Nessuna modifica");return}
 S.protos[k].push({ver:old.ver+1,date:today(),note:edit.note.trim(),rounds:p.rounds,ex:p.ex});
 persist();edit=null;toast("Scheda aggiornata: v"+cur(k).ver);location.hash="piano";route();
}

/* ---------- navigazione ---------- */
const TABS=["oggi","storico","progressi","piano"];
function route(){
 stopRO();
 if(!standalone()&&!browserOk){gate();return}
 document.getElementById("tabbar").style.display="";
 const h=(location.hash||"#oggi").slice(1),c=TABS.includes(h)?h:"oggi";
 for(const n of TABS){const a=document.getElementById("n-"+n);if(n==c)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")}
 view=c;edit=null;
 if(c=="storico")storico();else if(c=="progressi")progressi();else if(c=="piano")piano();else home();
 window.scrollTo(0,0);
}

/* ---------- eventi ---------- */
app.addEventListener("click",ev=>{
 const b=ev.target.closest("button");if(!b)return;
 const D=b.dataset,s=S.draft;
 if(b.id=="g-ok"){browserOk=true;try{sessionStorage.setItem("browser-ok","1")}catch(e){}route()}
 else if(D.leg)openLeg();
 else if(D.start)start(D.start);
 else if(b.id=="d-res"){view="sess";session();window.scrollTo(0,0)}
 else if(b.id=="d-del"){if(confirm("Scartare la sessione in corso?")){S.draft=null;persist();home()}}
 else if(D.go){location.hash=D.go;route()}
 else if(b.id=="f-save"||b.id=="f-save2")save();
 else if(D.tog&&s){const r=s.d[D.tog];r.v[+D.r]=r.v[+D.r]==1?0:1;persist();const on=r.v[+D.r]==1;b.className="tog "+(on?"ok":"no");b.setAttribute("aria-pressed",on);b.firstChild.textContent=on?"✓":"✗"}
 else if(D.rpe&&s){const r=s.d[D.rpe],v=+D.v;r.rpe=r.rpe==v?0:v;persist();
  b.parentElement.innerHTML=rpeBtns(D.rpe,r.rpe);const bd=document.getElementById("b-"+D.rpe);bd.setAttribute("style",badgeStyle(r.rpe));bd.querySelector("b").textContent=r.rpe||"–"}
 else if(D.del){if(!confirm("Eliminare questa sessione?"))return;S.sessions=S.sessions.filter(x=>x.id!=D.del);persist();storico();toast("Eliminata")}
 else if(b.id=="b-copy"){navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Backup copiato"),()=>toast("Copia non riuscita"))}
 else if(b.id=="b-export"){const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diario-allenamenti-"+today()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
 else if(D.ptpl){ptpl=D.ptpl;pex=null;pmode="perf";stopRO();progressi()}
 else if(D.pex){pex=D.pex;stopRO();progressi()}
 else if(D.pmode){pmode=D.pmode;stopRO();progressi()}
 else if(D.pgroup){pgroup=D.pgroup;stopRO();progressi()}
 else if(D.open){openDet=+D.open;view="det";detail();window.scrollTo(0,0)}
 else if(D.editsess){if(S.draft&&!confirm("C'è una sessione in corso non salvata. Vuoi scartarla?"))return;
  const o=S.sessions.find(x=>x.id==+D.editsess);S.draft=Object.assign(clone(o),{editOf:o.id});persist();view="sess";session();window.scrollTo(0,0)}
 else if(b.id=="b-csv"){const q=v=>{const t=String(v??"");return /[",;\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const H=["data","scheda","versione","esercizio","unita","obiettivo","giro","valore","completato","carico_kg","peso_corporeo_kg","carico_effettivo_kg","rpe_ultimo_giro","tacca_mm","durata_min","note"];
  const L=[H.join(";")];for(const s of [...S.sessions].sort((a,b)=>-byDate(a,b)))for(const e of s.ex){const r=s.d[e.id];if(!r)continue;const isT=timed(s,e);
   r.v.forEach((v,i)=>L.push([s.date,META[s.tpl].name,s.ver,e.name,e.u,e.t,i+1,isT?"":String(v).replace(".",","),isT?(v==1?"si":"no"):(v!==""&&+v>=e.t?"si":"no"),kg(+r.load||0),s.bw?kg(s.bw):"",isT?"":kg(effLoad(s,e)),r.rpe||"",s.edge||"",dur(s)||"",s.note||""].map(q).join(";")))}
  const blob=new Blob(["\ufeff"+L.join("\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="diario-allenamenti-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
 else if(D.edit){edit={k:D.edit,p:clone(cur(D.edit)),note:""};view="edit";editor();window.scrollTo(0,0)}
 else if(edit&&D.rd){edit.p.rounds=Math.min(10,Math.max(1,edit.p.rounds+ +D.rd));document.getElementById("e-r").textContent=edit.p.rounds}
 else if(edit&&D.mv){const i=+D.i,j=i+ +D.mv,a=edit.p.ex;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];editor()}
 else if(edit&&D.rm){const e=edit.p.ex[+D.rm];if(confirm(`Togliere "${e.name}" dalla scheda? Le sessioni passate lo conservano.`)){edit.p.ex.splice(+D.rm,1);editor()}}
 else if(edit&&b.id=="e-add"){edit.p.ex.push({id:edit.k+"-"+Date.now().toString(36),name:"Nuovo esercizio",u:"rip",t:10,load:0,bw:false,rest:30});editor();window.scrollTo(0,document.body.scrollHeight)}
 else if(edit&&(b.id=="e-save"||b.id=="e-save2"))saveEdit();
});
app.addEventListener("input",ev=>{
 const i=ev.target,s=S.draft;
 if(view=="sess"&&s){
  if(i.dataset.ex){const e=s.ex.find(x=>x.id==i.dataset.ex);const v=i.value.trim()===""?"":num(i.value);s.d[e.id].v[+i.dataset.r]=v;
   const c=i.closest(".cell"),bad=!okVal(e,v);c.classList.toggle("bad",bad);c.classList.toggle("low",!bad&&v!==""&&v<e.t);c.classList.toggle("up",!bad&&v!==""&&v>e.t)}
  else if(i.dataset.load){const v=num(i.value);s.d[i.dataset.load].load=v===""?0:v;i.classList.toggle("bad",!okLoad(v))}
  else if(i.id=="f-bw")s.bw=num(i.value);
  else if(i.id=="f-edge")s.edge=num(i.value);
  else if(i.id=="f-note")s.note=i.value;
  else if(i.id=="f-date")s.date=i.value||s.date;
  persist();
 }
 if(view=="edit"&&edit){
  if(i.id=="e-note")edit.note=i.value;
  else if(i.dataset.ef){const e=edit.p.ex[+i.dataset.i],f=i.dataset.ef;
   e[f]=f=="name"||f=="u"?i.value:f=="bw"?i.checked:(num(i.value)===""?0:num(i.value))}
 }
});
app.addEventListener("change",ev=>{
 const i=ev.target;
 if(view=="edit"&&edit&&i.dataset.ef=="bw")edit.p.ex[+i.dataset.i].bw=i.checked;
 if(view=="sess"&&S.draft&&i.id=="f-date"){S.draft.date=i.value||today();persist()}
 if(i.id!="b-import"||!i.files[0])return;
 i.files[0].text().then(txt=>{const d=migrate(JSON.parse(txt));
  const ok=x=>x&&META[x.tpl]&&x.d&&typeof x.d=="object"&&Array.isArray(x.ex)&&/^\d{4}-\d\d-\d\d$/.test(x.date);
  const ids=new Set(S.sessions.map(s=>s.id));
  const add=d.sessions.filter(s=>ok(s)&&!ids.has(s.id)),bad=d.sessions.filter(s=>!ok(s)).length,dup=d.sessions.length-add.length-bad;
  const rep=KEYS.filter(k=>{const t=(d.protos&&d.protos[k])||[];return t.length>S.protos[k].length&&t.every(v=>v&&Array.isArray(v.ex))});
  const msg=["Importazione:",`• ${add.length} sessioni nuove`,dup?`• ${dup} già presenti (ignorate)`:"",bad?`• ${bad} non valide (scartate)`:"",
   ...rep.map(k=>`• ${META[k].name}: la scheda del telefono (v${cur(k).ver}) verrà sostituita da quella del file (v${d.protos[k][d.protos[k].length-1].ver})`),
   ...KEYS.filter(k=>!rep.includes(k)&&d.protos&&d.protos[k]&&d.protos[k].length<S.protos[k].length).map(k=>`• ${META[k].name}: resta la scheda del telefono (v${cur(k).ver}), più recente del file`),
   "","Procedere?"].filter(x=>x!=="").join("\n");
  if(!confirm(msg)){i.value="";return}
  S.sessions.push(...add);for(const k of rep)S.protos[k]=d.protos[k];
  persist();storico();toast(add.length+" sessioni importate")}).catch(()=>toast("File non valido"));
});
app.addEventListener("focusin",ev=>{if(ev.target.matches(".cell input,.kg input"))ev.target.select()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="hidden")persist()});
window.addEventListener("pagehide",persist);
window.addEventListener("hashchange",route);
route();
if("serviceWorker" in navigator&&location.protocol=="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
}
